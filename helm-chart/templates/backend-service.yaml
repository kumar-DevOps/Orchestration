apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: streaming
    port: 8080
    targetPort: {{ .Values.backend.streaming.servicePort }}
  - name: chat
    port: 8081
    targetPort: {{ .Values.backend.chat.servicePort }}
  - name: admin
    port: 8082
    targetPort: {{ .Values.backend.admin.servicePort }}
  - name: auth
    port: 8083
    targetPort: {{ .Values.backend.auth.servicePort }}
